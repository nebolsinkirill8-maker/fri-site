{# Adapted from Status Badge by serafimcloud, 21st.dev demo 521. #}
<p class="application-badge" data-status="{{ entry.status }}">
  <span class="application-badge-state"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/>{% if entry.status == 'accepted' %}<path d="m8 12 3 3 5-6"/>{% elif entry.status == 'rejected' %}<path d="m9 9 6 6m0-6-6 6"/>{% else %}<path d="M12 7v5l3 2"/>{% endif %}</svg>{{ entry.get_status_display }}</span>
  <span class="application-badge-number">Заявка №{{ entry.pk }}</span>
</p>
